id: C-03_SV_TO_LLM
version: "1.0.0"

filter:
  include_status: ["BOOKED", "PENDING"]

sort:
  keys: ["value_date", "record_id"]
  order: ASC

window:
  last_n: 200

truncate:
  counterparty_name_max_len: 80
  remittance_max_len: 160

output:
  format: JSON
  file: "projections/llm_context_v1.json"
  schema: "S-03"
  cardinality: >
    One context object per account.  When the SV bundle contains a single
    account the output is a plain JSON object; when it contains multiple
    accounts the output is a JSON array of context objects (one per account).

shape:
  meta:
    run_id: "$.meta.run_id"
    created_at_utc: "$.meta.created_at_utc"
    account_id: "@current_account.account_id"
    iban: "@current_account.iban"
    currency: "@current_account.currency"
  tx:
    - id: "$.record_id"
      d: "$.value_date"
      s: "$.status"
      dir: "$.direction"
      a: "$.amount.signed"
      c: "$.amount.currency"
      cp: "$.counterparty.name|truncate(80)"
      r: "$.remittance|truncate(160)"

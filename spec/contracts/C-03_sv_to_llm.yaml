id: C-03_SV_TO_LLM
version: "1.0.0"

filter:
  include_status: ["BOOKED", "PENDING"]

sort:
  keys: ["value_date", "record_id"]
  order: ASC

window:
  last_n: 200

truncate:
  counterparty_name_max_len: 80
  remittance_max_len: 160

output:
  format: JSON
  file: "out/llm_context.json"

shape:
  meta:
    run_id: "$.meta.run_id"
    created_at_utc: "$.meta.created_at_utc"
    account_id: "$.accounts[0].account_id"
    iban: "$.accounts[0].iban"
    currency: "$.accounts[0].currency"
  tx:
    - id: "$.record_id"
      d: "$.value_date"
      s: "$.status"
      dir: "$.direction"
      a: "$.amount.signed"
      c: "$.amount.currency"
      cp: "$.counterparty.name|truncate(80)"
      r: "$.remittance|truncate(160)"

# Error Catalog — veakoodide kataloog
# Lists every issue code the adapter pipeline may emit in report.issues[].
# Version follows semver; bump when adding or removing entries.

version: "1.0.0"

entries:
  - code: S-00A_VALIDATION
    default_severity: ERROR
    stage: READ_INPUT
    description: >-
      Berlin AIS accounts input (accounts.json) failed validation against
      the S-00A JSON Schema.
    remediation: >-
      Check the accounts.json payload structure against
      spec/schemas/S-00A_berlin_accounts.schema.json.

  - code: S-00B_VALIDATION
    default_severity: ERROR
    stage: READ_INPUT
    description: >-
      Berlin AIS transactions input (transactions.json) failed validation
      against the S-00B JSON Schema.
    remediation: >-
      Check the transactions.json payload structure against
      spec/schemas/S-00B_berlin_transactions.schema.json.

  - code: S-00C_VALIDATION
    default_severity: ERROR
    stage: READ_INPUT
    description: >-
      Berlin AIS standing-orders input (standing_orders.json) failed
      validation against the S-00C JSON Schema.
    remediation: >-
      Check the standing_orders.json payload structure against
      spec/schemas/S-00C_berlin_standing_orders.schema.json.

  - code: S-01_VALIDATION
    default_severity: ERROR
    stage: VALIDATE_SCHEMA
    description: >-
      The generated Standardized Vaheesitus (SV) bundle failed validation
      against the S-01 JSON Schema after the mapping stage.
    remediation: >-
      Inspect the mapping rules in spec/contracts/C-01_berlin_to_sv.yaml
      and the input data that produced the invalid SV field.
